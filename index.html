<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- PWA / TWA Required Meta Tags -->
  <meta name="theme-color" content="#0B0B0B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  
  <title>WORKOUT UP · единый стиль</title>
  <style>
    /* ===== ЕДИНАЯ СИСТЕМА ДИЗАЙНА ===== */
    :root {
      --bg: #0B0B0B;
      --surface: #141414;
      --surface-elevated: #1C1C1C;
      --border: #2A2A2A;
      --border-light: #3A3A3A;
      --accent: #00E676;
      --accent-dim: #00B85C;
      --text-primary: #F0F0F0;
      --text-secondary: #A0A0A0;
      --text-muted: #707070;
      --danger: #FF4D4D;
      --danger-dim: #CC3333;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.6);
      
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 20px;
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      --ease-snap: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    html, body { width: 100%; height: 100%; overflow-x: hidden; background: var(--bg); }
    body { 
      color: var(--text-primary); 
      font-family: var(--font-sans); 
      line-height: 1.5; 
      padding-bottom: calc(70px + env(safe-area-inset-bottom, 0px)); 
      min-height: 100vh; 
      -webkit-font-smoothing: antialiased; 
    }    .app { max-width: 440px; margin: 0 auto; padding: 0 var(--space-lg); width: 100%; }
    
    /* ===== ТИПОГРАФИКА ===== */
    .header { padding: var(--space-xl) 0 var(--space-md); border-bottom: 1px solid var(--border); margin-bottom: var(--space-lg); }
    .header h1 { font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; color: var(--text-primary); }
    .header h1 span { color: var(--accent); }
    
    .view { display: none; animation: viewEnter 0.25s var(--ease-snap) both; }
    .view.active { display: block; }
    @keyframes viewEnter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    
    .panel { 
      background: var(--surface); 
      border-radius: var(--radius-md); 
      padding: var(--space-lg); 
      margin-bottom: var(--space-lg); 
      border: 1px solid var(--border); 
      box-shadow: var(--shadow-sm); 
    }
    .panel-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: var(--space-md); 
      flex-wrap: wrap; 
      gap: var(--space-sm); 
    }
    .panel-title { 
      font-size: 13px; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      color: var(--text-secondary); 
      font-weight: 700; 
    }
    .panel-total { 
      background: rgba(0, 230, 118, 0.12);
      color: var(--accent);
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 20px;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border: 1px solid rgba(0, 230, 118, 0.3);
      font-family: var(--font-mono);
    }
    .panel-total svg { width: 12px; height: 12px; fill: var(--accent); }    
    .workout-date { 
      text-align: center; 
      padding: 6px 0 var(--space-md); 
      font-family: var(--font-mono); 
      font-size: 14px; 
      color: var(--text-secondary); 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      font-weight: 500; 
      border-bottom: 1px dashed var(--border); 
      margin-bottom: var(--space-lg); 
    }
    
    .workout-name-wrap { position: relative; margin-bottom: var(--space-lg); }
    .workout-name-input { 
      width: 100%; 
      padding: 14px 48px 14px 14px; 
      background: var(--surface); 
      border: 1.5px solid var(--border); 
      border-radius: var(--radius-md); 
      color: var(--accent); 
      font-family: var(--font-sans); 
      font-size: 15px; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      text-align: center; 
      outline: none; 
      transition: border-color 0.2s, box-shadow 0.2s; 
      -webkit-appearance: none; 
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); 
    }
    .workout-name-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0, 230, 118, 0.15), inset 0 2px 4px rgba(0,0,0,0.2); }
    .workout-name-input::placeholder { color: var(--text-muted); font-weight: 400; font-size: 13px; }
    .template-btn { 
      position: absolute; 
      right: 8px; 
      top: 50%; 
      transform: translateY(-50%); 
      background: var(--surface-elevated); 
      border: 1.5px solid var(--border); 
      border-radius: var(--radius-sm); 
      color: var(--text-muted); 
      width: 40px; 
      height: 40px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer;       transition: all 0.15s; 
      padding: 0; 
    }
    .template-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
    .template-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    .input { background: var(--surface); border-radius: var(--radius-sm); border: 1.5px solid var(--border); transition: border-color 0.2s, box-shadow 0.2s; position: relative; }
    .input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(0, 230, 118, 0.2); }
    .input input { 
      width: 100%; 
      background: transparent; 
      border: none; 
      color: var(--text-primary); 
      font-family: var(--font-mono); 
      font-size: 15px; 
      padding: 12px 12px; 
      outline: none; 
      -webkit-appearance: none; 
    }
    .input input::placeholder { color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 1px; font-weight: 400; }
    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
    
    .autocomplete-list { 
      position: absolute; 
      top: calc(100% + 4px); 
      left: 0; 
      right: 0; 
      background: var(--surface-elevated); 
      border: 1px solid var(--border-light); 
      border-radius: var(--radius-sm); 
      max-height: 220px; 
      overflow-y: auto; 
      z-index: 400; 
      display: none; 
      box-shadow: var(--shadow-md); 
    }
    .autocomplete-item { 
      padding: 12px 14px; 
      font-family: var(--font-mono); 
      font-size: 13px; 
      color: var(--text-primary); 
      text-transform: uppercase; 
      cursor: pointer; 
      border-bottom: 1px solid var(--border); 
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:hover, .autocomplete-item.selected { background: var(--surface); color: var(--accent); }
    
    .btn { 
      width: 100%;       padding: 14px 18px; 
      background: var(--surface-elevated); 
      border: 1.5px solid var(--border); 
      border-radius: var(--radius-md); 
      color: var(--text-primary); 
      font-weight: 600; 
      font-size: 13px; 
      text-transform: uppercase; 
      letter-spacing: 1.5px; 
      cursor: pointer; 
      transition: all 0.15s; 
      -webkit-appearance: none; 
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      box-shadow: var(--shadow-sm); 
      min-height: 52px; 
    }
    .btn:active { transform: scale(0.98); background: var(--surface); box-shadow: none; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; box-shadow: 0 4px 10px rgba(0, 230, 118, 0.25); }
    .btn-primary:active { background: var(--accent-dim); border-color: var(--accent-dim); box-shadow: 0 2px 4px rgba(0, 230, 118, 0.3); }
    .btn-add-set { 
      background: transparent; 
      border: 2px dashed var(--border-light); 
      color: var(--text-secondary); 
      font-weight: 600; 
      margin-bottom: var(--space-xl); 
      box-shadow: none; 
    }
    .btn-add-set svg { width: 20px; height: 20px; stroke: currentColor; }
    .btn-add-set:active { border-color: var(--accent); color: var(--accent); background: rgba(0, 230, 118, 0.05); }
    .btn-add-set:disabled { opacity: 0.3; pointer-events: none; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none; }
    
    .sets-grid { display: grid; grid-template-columns: 1fr; gap: var(--space-md); margin-bottom: var(--space-lg); }
    .ex-col { 
      background: var(--surface); 
      border-radius: var(--radius-md); 
      padding: var(--space-md); 
      border: 1px solid var(--border); 
      box-shadow: var(--shadow-sm); 
    }
    .ex-header { display: flex; align-items: center; gap: 8px; margin-bottom: var(--space-md); flex-wrap: wrap; }
    .ex-name { 
      font-family: var(--font-mono); 
      font-size: 14px; 
      color: var(--accent); 
      text-transform: uppercase; 
      font-weight: 700;       letter-spacing: 0.8px; 
      line-height: 1.2; 
      word-break: break-word; 
      flex: 1; 
      min-width: 110px; 
    }
    .ex-edit-btn { 
      background: var(--surface-elevated); 
      border: 1px solid var(--border); 
      border-radius: var(--radius-sm); 
      color: var(--text-muted); 
      font-size: 12px; 
      padding: 6px 10px; 
      text-transform: uppercase; 
      cursor: pointer; 
      transition: all 0.15s; 
      font-family: var(--font-mono); 
      font-weight: 600; 
      min-width: 50px; 
      text-align: center; 
    }
    .ex-edit-btn:active { background: var(--accent); color: #000; border-color: var(--accent); }
    .ex-edit-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .ex-badge { 
      background: rgba(0, 230, 118, 0.12); 
      color: var(--accent); 
      padding: 5px 8px; 
      font-size: 11px; 
      font-weight: 700; 
      text-transform: uppercase; 
      border-radius: 20px; 
      white-space: nowrap; 
      display: inline-flex; 
      align-items: center; 
      gap: 5px; 
      border: 1px solid rgba(0, 230, 118, 0.3); 
    }
    .ex-badge svg { width: 12px; height: 12px; fill: var(--accent); }
    
    .ex-name-input { 
      font-family: var(--font-mono); 
      font-size: 14px; 
      color: var(--accent); 
      text-transform: uppercase; 
      font-weight: 700; 
      letter-spacing: 0.8px; 
      background: transparent; 
      border: 1px solid var(--border-light); 
      border-radius: var(--radius-sm); 
      padding: 6px 8px;       outline: none; 
      width: auto; 
      min-width: 130px; 
    }
    .ex-name-input:focus { border-color: var(--accent); }
    
    .ex-set-edit-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .ex-set-edit-row .set-num { color: var(--text-muted); font-size: 11px; min-width: 28px; }
    .ex-set-edit-row .input { flex: 1; }
    .ex-set-edit-row .input input { padding: 8px 6px; font-size: 13px; text-align: center; }
    .ex-set-edit-row .del-set { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 4px 6px; }
    .ex-set-edit-row .del-set:active { color: var(--danger); }
    
    .ex-add-set-btn { 
      background: none; 
      border: 1px dashed var(--border-light); 
      color: var(--text-muted); 
      font-size: 11px; 
      padding: 8px 10px; 
      border-radius: var(--radius-sm); 
      cursor: pointer; 
      margin-top: 10px; 
      text-transform: uppercase; 
      font-family: var(--font-mono); 
      width: 100%; 
      font-weight: 600; 
    }
    .ex-add-set-btn:active { border-color: var(--accent); color: var(--accent); background: rgba(0,230,118,0.05); }
    
    .ex-sets { display: flex; flex-direction: column; gap: 4px; }
    .ex-set { 
      font-family: var(--font-mono); 
      font-size: 14px; 
      color: var(--text-primary); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 6px 0; 
      border-bottom: 1px solid var(--border); 
    }
    .ex-set:last-child { border-bottom: none; }
    .ex-set .set-num { color: var(--text-muted); font-size: 11px; min-width: 28px; }
    .ex-set .set-data { text-align: right; flex: 1; font-weight: 500; }
    
    /* ===== HISTORY ===== */
    .history-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md); position: relative; }
    .history-title-section { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-secondary); font-weight: 700; }
    
    /* Кнопка меню (Вариант В) */
    .history-menu-btn {      background: transparent;
      border: none;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      transition: color 0.2s;
      padding: 0;
      border-radius: 40px;
    }
    .history-menu-btn:active { color: var(--accent); background: rgba(0, 230, 118, 0.1); }
    .history-menu-btn svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2; fill: none; }
    
    .history-menu-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      background: var(--surface-elevated);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      min-width: 180px;
      z-index: 300;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.95);
      transition: opacity 0.2s var(--ease-snap), transform 0.2s var(--ease-snap), visibility 0.2s;
      overflow: hidden;
    }
    .history-menu-dropdown.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }
    .history-menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      width: 100%;
      background: none;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .history-menu-item:last-child { border-bottom: none; }
    .history-menu-item:hover { background: var(--surface); }
    .history-menu-item:active { background: var(--accent); color: #000; }
    .history-menu-item svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; }
    .history-menu-item.danger { color: var(--danger); }
    .history-menu-item.danger:active { background: var(--danger); color: #000; }
    
    /* Неактивные пункты меню */
    .history-menu-item.disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    
    .history-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-lg); gap: 12px; }
    .history-nav-btn { background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; padding: 6px 12px; transition: all 0.2s; }
    .history-nav-btn:active { color: var(--accent); }
    .history-period-label { flex: 1; text-align: center; font-family: var(--font-mono); font-size: 14px; color: var(--text-primary); text-transform: uppercase; letter-spacing: 1.5px; font-weight: 700; }
    
    .history-folder { margin-bottom: 6px; }
    .history-folder-header { 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 12px 14px; 
      background: var(--surface-elevated); 
      border: 1px solid var(--border); 
      border-radius: var(--radius-md); 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .history-folder-header:active { background: var(--surface); border-color: var(--border-light); }
    .history-folder-title { font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .history-folder-meta { display: flex; align-items: center; gap: 8px; }
    .history-folder-count { background: rgba(0, 230, 118, 0.15); color: var(--accent); padding: 4px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; font-family: var(--font-mono); }
    .history-folder-arrow { color: var(--text-muted); font-size: 12px; transition: transform 0.3s var(--ease-snap); }
    .history-folder.expanded .history-folder-arrow { transform: rotate(180deg); }
    .history-folder-content { max-height: 0; overflow: hidden; transition: max-height 0.4s var(--ease-snap); margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--border); }
    .history-folder.expanded .history-folder-content { max-height: 3000px; }
    
    .history-item { 
      background: var(--surface); 
      border-radius: var(--radius-md); 
      border: 1px solid var(--border); 
      box-shadow: var(--shadow-sm);       overflow: hidden; 
      transition: box-shadow 0.2s; 
      margin-bottom: var(--space-md);
    }
    .history-item.expanded { box-shadow: var(--shadow-md); border-color: var(--border-light); }
    .history-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 14px 14px; 
      cursor: pointer;
    }
    .history-header::after { content: '▼'; font-size: 14px; color: var(--text-muted); margin-left: 12px; transition: transform 0.3s var(--ease-snap); }
    .history-item.expanded .history-header::after { content: '▲'; }
    .history-meta-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .history-meta { font-family: var(--font-mono); color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px; }
    .history-tonnage { font-family: var(--font-mono); color: var(--text-secondary); font-weight: 600; font-size: 13px; }
    .history-title { text-transform: uppercase; letter-spacing: 1px; color: var(--text-primary); font-size: 14px; font-weight: 700; }
    
    .history-content { max-height: 0; overflow: hidden; transition: max-height 0.4s var(--ease-snap); opacity: 0; padding: 0 14px; }
    .history-item.expanded .history-content { max-height: 3000px; opacity: 1; padding-bottom: 8px; }
    .history-exercise-list { display: flex; flex-direction: column; gap: 14px; }
    .history-exercise-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
    .history-exercise-name { font-family: var(--font-mono); font-size: 13px; color: var(--accent); text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
    .history-exercise-sets { display: flex; flex-direction: column; gap: 4px; }
    .history-set-row { display: flex; align-items: center; font-family: var(--font-mono); font-size: 13px; color: var(--text-primary); padding: 4px 0; }
    .history-set-num { color: var(--text-muted); font-size: 11px; min-width: 32px; }
    .history-set-data { flex: 1; }
    .history-divider { height: 1px; background: var(--border); margin: 10px 0; }
    .history-actions { display: flex; gap: 8px; padding: 8px 14px 14px; }
    .history-actions button { 
      flex: 1; 
      padding: 10px 6px; 
      background: var(--surface-elevated); 
      border: 1px solid var(--border); 
      border-radius: var(--radius-sm); 
      font-family: var(--font-mono); 
      font-size: 11px; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      cursor: pointer; 
      color: var(--text-secondary); 
      font-weight: 700; 
      transition: all 0.15s; 
    }
    .history-actions button:active { background: var(--surface); color: var(--text-primary); }
    .history-actions button.del:active { color: var(--danger) !important; border-color: var(--danger); background: rgba(255, 77, 77, 0.1); }
    
    /* ===== МОДАЛКИ ===== */
    .confirm-modal-overlay, .modal-overlay {       position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.8); 
      backdrop-filter: blur(4px); 
      z-index: 1000; 
      display: none; 
      align-items: center; 
      justify-content: center; 
      padding: var(--space-lg); 
    }
    .confirm-modal-overlay.active, .modal-overlay.active { display: flex; animation: fadeIn 0.2s var(--ease-snap); }
    .confirm-modal, .modal { 
      background: var(--surface-elevated); 
      border-radius: var(--radius-lg); 
      padding: 24px 20px; 
      width: 100%; 
      max-width: 380px; 
      border: 1px solid var(--border-light); 
      box-shadow: var(--shadow-md); 
      max-height: 85vh; 
      overflow-y: auto; 
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal { animation: slideUp 0.25s var(--ease-snap); }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-title, .confirm-modal-title { 
      font-size: 16px; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      margin-bottom: 20px; 
      color: var(--text-primary); 
    }
    .confirm-modal-message { font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.4; }
    .confirm-modal-actions, .modal-actions { display: flex; gap: 12px; margin-top: 8px; }
    .modal-inputs { display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px; }
    
    .error-message {
      color: var(--danger);
      font-size: 11px;
      margin-top: 4px;
      padding-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input.error { border-color: var(--danger) !important; }

    /* ===== НАВИГАЦИЯ ===== */
    .nav {

      bottom: 0; 
      left: 0;

      pointer-events: none; 
      box-shadow: var(--shadow-md); 
      white-space: nowrap; 
    }
    .toast.visible { opacity: 1; }
    #file-import { display: none; }
    
    /* ===== ШАБЛОНЫ ===== */
    .tmpl-card { background: var(--surface); border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--border); margin-bottom: 12px; box-shadow: var(--shadow-sm); }

    .tmpl-actions button:active { background: var(--accent); color: #000; border-color: var(--accent); }

  <div class="app">

    (function() {
      'use strict';
      // ===== STATE =====
      var state = {

, 0); filterEnd.setHours(23,59,59,999); } state.exerciseFilter = { start: filterStart, end: filterEnd }; state.lastSelectedIndex = index; } updateExercisePanel(); });
        document.addEventListener('touchstart', function(e) { if (!els.chartContainer.contains(e.target)) els.chartTooltip.classList.remove('visible'); }, {passive: true});
